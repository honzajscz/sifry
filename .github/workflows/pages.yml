# Zveřejní webový luštitel (složka web/) na GitHub Pages.
# Jednorázově: Settings > Pages > Build and deployment > Source: GitHub Actions.
name: Luštitel na GitHub Pages

on:
  push:
    branches: [master]
    paths: ['web/**', 'spa2/src/main/assets/raw/**', '.github/workflows/pages.yml']
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Testy luštitele
        run: node web/tools/test.mjs
      - name: Úplný slovník z aplikace pro hledání slov
        run: zcat spa2/src/main/assets/raw/cs.canon.gz | cut -d: -f1 | uniq | gzip -9 > web/data/cs-full.txt.gz
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
